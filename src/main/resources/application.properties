spring.application.name=registro-usuarios

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.frontend-url=${MERCADOPAGO_FRONTEND_URL:http://localhost:4200}
mercadopago.mode=${MERCADOPAGO_MODE:test}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# URL pública del webhook. Al usar ngrok, define MERCADOPAGO_NOTIFICATION_URL con la URL vigente.
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
mercadopago.preference-expiration-minutes=30

# URLs públicas configurables para producción
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.backend-url=${BACKEND_URL:http://localhost:8080}
